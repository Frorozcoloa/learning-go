name: CI/CD Aroma Argelino

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # TRABAJO 1: Calidad y Pruebas (Siempre corre)
  # ==========================================
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: go mod tidy

      - name: Run Unit Tests
        run: go test -v -coverprofile=coverage.out ./...

      - name: Generate HTML Coverage Report
        run: |
          mkdir -p htmlcov
          go tool cover -html=coverage.out -o htmlcov/index.html

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

      - name: Display Coverage Summary
        run: go tool cover -func=coverage.out

  # ==========================================
  # TRABAJO 2: Docker Build, Test & Push
  # ==========================================
  build-and-push-docker:
    needs: test-and-lint
    # Solo sube la imagen si es un PUSH (merge) a main o develop
    # En PRs solo construye y testea el contenedor sin subirlo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Construye y carga localmente para testear (Smoke Test)
      - name: Build and load
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container (Smoke Test)
        run: |
          # Usamos el primer tag generado para la prueba
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name test-api -p 3000:3000 $IMAGE_TAG
          
          # Esperar a que Fiber responda en /ping
          timeout 30s bash -c 'until curl -f http://localhost:3000/ping; do sleep 2; done' || (docker logs test-api && exit 1)
          
          docker stop test-api && docker rm test-api

      # Si no es PR y los pasos anteriores pasaron, hacemos el Push final
      - name: Push Docker image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max